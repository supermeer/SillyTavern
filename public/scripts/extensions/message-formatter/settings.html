<div class="message-formatter-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b data-i18n="Message Formatter">Message Formatter</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <label class="checkbox_label" for="message_formatter_enabled">
                <input id="message_formatter_enabled" type="checkbox" />
                <span data-i18n="Enable message formatter">Enable message formatter</span>
            </label>
            <label class="checkbox_label" for="message_formatter_auto_fix">
                <input id="message_formatter_auto_fix" type="checkbox" />
                <span data-i18n="Auto-fix unbalanced Markdown markers">Auto-fix unbalanced Markdown markers</span>
            </label>
            <label class="checkbox_label" for="message_formatter_quotes">
                <input id="message_formatter_quotes" type="checkbox" />
                <span data-i18n="Highlight quoted dialogue">Highlight quoted dialogue</span>
            </label>
            <div class="message-formatter-note">
                <span data-i18n="Adds the message styling rules that upstream SillyTavern does not ship: strikethrough, link colours, heading sizes, inline code background and the accent-coloured separator.">Adds the message styling rules that upstream SillyTavern does not ship: strikethrough, link colours, heading sizes, inline code background and the accent-coloured separator.</span>
            </div>
            <div class="message-formatter-note">
                <a href="/scripts/extensions/message-formatter/message-formatter-demo.html" target="_blank" rel="noopener" data-i18n="Open the standalone demo">Open the standalone demo</a>
            </div>
        </div>
    </div>
</div>
